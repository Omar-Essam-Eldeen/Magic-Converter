    <style>
      /* Boot splash: his artwork, shown instantly from the HTML shell while
         the app bundle loads; the app fades it out on mount. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999; background: #07070a;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #boot-splash img { height: 100%; width: 100%; object-fit: cover; display: block; }
      @media (min-aspect-ratio: 3/4) { #boot-splash img { object-fit: contain; } }
      #boot-splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #boot-splash { transition: none; } }
    </style>
  </head>
